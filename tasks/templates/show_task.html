<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    {% comment %} <div>
       <ol>
            {% for emp in tasks %}
                <li>
                    <p>{{emp}}</p>
                </li>
                <ul class=text-gray-500>
                     {% for t in emp.tasks.all %}
                    <li class='ms-5'>{{t}}</li>
                    {% endfor %} 
                </ul>
            {% endfor %}
            </ol> 
            
    </div> {% endcomment %}
    <div>
        <p>{{tasks.c}}</p>
       
    </div>
</body>
</html>
