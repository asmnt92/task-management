{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="w-1/2 mx-auto mt-8">
        {% if messages %}
        {% for message in messages %}
        <div class="p-2 text-center {% if message.tags == 'success' %}bg-green-400{% endif %}">{{message}}</div>
        {% endfor %}
        {% endif %}

        <div>
        <form method="POST">
            
            {% csrf_token %}
            {{ task_form}}
            {{task_detail}}
            
            <button type="submit" class="bg-rose-600 px-3 py-2 text-white mt-2 mb-3 rounded-md">Submit</button>
        </form>
    </div>
</body>
</html>
